name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ready:
    name: check + unitários + stories + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/voidzero-dev/vite-plus:0.2.8
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - run: vp install --frozen-lockfile

      - name: Chromium do Playwright
        run: vp -C packages/ui exec playwright install --with-deps chromium

      - name: Gerar a árvore de rotas
        run: vp -C apps/web build

      - run: vp run ready

      # O lcov que o job `sonarqube` consome. São os mesmos unitários que o
      # `vp run ready` acabou de rodar, de novo e só para escrever o relatório —
      # custa menos de um segundo, porque o `vp test` da raiz não sobe browser.
      #
      # Fica AQUI, e não no job do scanner, porque quem sabe rodar `vp` é este
      # container. O scanner roda num runner limpo (ver o job `sonarqube`) e
      # recebe o arquivo por artefato.
      - name: Cobertura dos unitários
        run: vp test --coverage --coverage.reporter=lcov

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

  e2e:
    name: playwright (33 cenários)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/voidzero-dev/vite-plus:0.2.8
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - run: vp install --frozen-lockfile

      - name: Chromium do Playwright
        run: vp -C apps/web exec playwright install --with-deps chromium

      - run: vp -C apps/web run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  mutation:
    name: stryker (domain + infra)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/voidzero-dev/vite-plus:0.2.8
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - name: procps (o Stryker chama `ps` para varrer os processos filhos)
        run: apt-get update && apt-get install -y --no-install-recommends procps

      - run: vp install --frozen-lockfile

      - run: vp -C packages/domain run test:mutation
      - run: vp -C packages/infra run test:mutation

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mutation-reports
          path: |
            packages/domain/reports/mutation
            packages/infra/reports/mutation
          retention-days: 7

  visual:
    name: regressão visual (95 stories)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/voidzero-dev/vite-plus:0.2.8
      options: --user root
    steps:
      - uses: actions/checkout@v5

      - run: vp install --frozen-lockfile

      - name: Chromium do Playwright
        run: vp -C packages/ui exec playwright install --with-deps chromium

      - name: Restaurar a baseline visual
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: packages/ui/.vrt/baseline
          key: vrt-baseline-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            vrt-baseline-${{ runner.os }}-${{ runner.arch }}-

      - name: Avisar quando não existe baseline
        if: ${{ steps.baseline.outputs.cache-matched-key == '' }}
        run: echo "::warning::sem baseline no cache — esta execução apenas grava a primeira, nada foi comparado"

      - run: vp run vrt

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: packages/ui/.vrt/report
          retention-days: 7

      - name: Guardar a baseline
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v4
        with:
          path: packages/ui/.vrt/baseline
          key: vrt-baseline-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  sonarqube:
    name: sonarqube cloud (análise estática + cobertura)
    needs: [ready]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # SEM `container:`, ao contrário dos outros jobs. Este é o único que não
    # roda `vp`: o scanner traz o próprio toolchain (baixa o Sonar Scanner CLI,
    # confere a assinatura GPG e usa o JRE embutido nele), e a cobertura chega
    # pronta pelo artefato do `ready`. Pôr a imagem do Vite+ aqui só
    # acrescentaria dependências que a análise não usa.
    steps:
      # PRÉ-REQUISITO, uma vez por repositório: Settings › Secrets and variables
      # › Actions › `SONAR_TOKEN`, com o token gerado em My Account › Security na
      # SonarCloud. Sem ele o scanner morre em "You're not authorized to analyze
      # this project" — não é erro de configuração do sonar-project.properties.
      #
      # `fetch-depth: 0` NÃO é excesso de zelo: o scanner usa o histórico do git
      # para atribuir cada linha a um commit e a uma data, e é isso que separa
      # "código novo" de "código legado". Num clone raso todo arquivo parece ter
      # nascido no último commit, e o portão de código novo passa a julgar o
      # projeto inteiro a cada push.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      # A ação lê `sonar-project.properties` da raiz — escopo, classificação
      # fonte/teste e o caminho do lcov estão todos lá.
      #
      # Fixada por SHA, e não por tag: tag em repositório de terceiro é ponteiro
      # móvel, e este passo recebe o `SONAR_TOKEN`. O comentário ao lado diz a
      # qual release o SHA corresponde.
      #
      # `qualitygate.wait=true` porque sem ele a ação só ENVIA a análise e sai
      # em verde independentemente do resultado: o job existiria sem nunca poder
      # reprovar nada. Com ele, o job espera o veredito e falha junto com o
      # portão.
      #
      # DE PROPÓSITO fora do `needs` do `publish`, por ora: na primeira análise
      # de um projeto novo a SonarCloud ainda não tem linha de base, então o
      # portão julga o repositório inteiro como "código novo". Depois que a
      # primeira análise de `main` fixar a base, `sonarqube` entra no `needs`
      # junto com os outros quatro.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  publish:
    name: publicar o Storybook no GitHub Pages
    needs: [ready, e2e, mutation, visual]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/voidzero-dev/vite-plus:0.2.8
      options: --user root

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - run: vp install --frozen-lockfile

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build do Storybook
        env:
          STORYBOOK_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: vp run build-storybook

      - name: Conferir que o build saiu com o base certo
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          test -f packages/ui/storybook-static/index.html
          test -f packages/ui/storybook-static/iframe.html
          expected="${BASE_PATH%/}/assets/"
          if ! grep -q "\"${expected}" packages/ui/storybook-static/iframe.html; then
            echo "::error::iframe.html não referencia ${expected} — o base não foi aplicado"
            grep -oE '(src|href)="[^"]*assets/[^"]*"' packages/ui/storybook-static/iframe.html | head -5
            exit 1
          fi
          echo "base aplicado: ${expected}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/ui/storybook-static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
