sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=.

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,apps/web/e2e/**

sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.stories.tsx,\
  apps/web/e2e/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/reports/**,\
  coverage/**,\
  docs/**,\
  packages/ui/storybook-static/**,\
  packages/ui/.vrt/**,\
  apps/web/playwright-report/**,\
  apps/web/test-results/**,\
  apps/web/src/routeTree.gen.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
  **/*.tsx,\
  **/*.config.ts,\
  **/*.config.mjs,\
  vite.config.ts,\
  packages/ui/**,\
  apps/web/src/hooks/**,\
  apps/web/src/stores/**,\
  apps/web/src/search-params.ts,\
  apps/web/src/lib/dev-axe.ts
