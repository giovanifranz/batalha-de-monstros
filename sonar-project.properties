# Configuração do SonarQube Cloud (SonarCloud). Lida pelo `sonarqube-scan-action`
# no job `sonarqube` de .github/workflows/ci.yml.
#
# Fica na RAIZ de propósito: o scanner sobe a partir do diretório de trabalho
# procurando este arquivo, e é ele quem define a raiz da análise. Um arquivo por
# pacote faria quatro projetos separados na SonarCloud — este monorepo é um só.

# ---------------------------------------------------------------------------
# Identificação
# ---------------------------------------------------------------------------
#
# Chave e organização vêm da tela de onboarding da SonarCloud; não são
# inventáveis nem editáveis depois sem recriar o projeto lá.
sonar.projectKey=giovanifranz_batalha-de-monstros
sonar.organization=giovanifranz
sonar.projectName=batalha-de-monstros

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Escopo
# ---------------------------------------------------------------------------
#
# Os testes moram AO LADO do código (`monster.ts` e `monster.test.ts` na mesma
# pasta), então `sonar.sources` e `sonar.tests` apontam os dois para a raiz e
# quem separa é a classificação abaixo. Sem essa separação o scanner morre com
# "File can't be indexed twice" — o mesmo arquivo entrando como fonte e como
# teste.
#
# A distinção não é burocrática: regra de fonte cobra complexidade, duplicação e
# segurança; regra de teste cobra asserção faltando, `.only` esquecido, teste
# vazio. Marcar um teste como fonte enche o relatório de falso positivo.
sonar.sources=.
sonar.tests=.

# Estes viram TESTE.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.stories.tsx,apps/web/e2e/**

# Estes saem das FONTES. As três primeiras linhas repetem os padrões de teste
# acima — `sonar.exclusions` só vale para fonte, `sonar.test.exclusions` é que
# valeria para teste, então repetir aqui tira o arquivo do lado de fonte sem
# tirá-lo do lado de teste. É essa a metade que evita o "indexed twice".
#
# O `Dockerfile` e o `docker/` NÃO estão excluídos de propósito: a SonarCloud
# tem analisador de Docker, e a imagem que publica o app merece a mesma régua
# que o resto.
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.stories.tsx,\
  apps/web/e2e/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/reports/**,\
  coverage/**,\
  docs/**,\
  packages/ui/storybook-static/**,\
  packages/ui/.vrt/**,\
  apps/web/playwright-report/**,\
  apps/web/test-results/**,\
  apps/web/src/routeTree.gen.ts

# ---------------------------------------------------------------------------
# Cobertura
# ---------------------------------------------------------------------------
#
# Um lcov só, gerado pelo `vp test --coverage` dentro do job `ready` — que roda
# o workspace como um projeto Vitest único e cobre os 94 unitários de domain,
# infra e apps/web. O job `sonarqube` recebe o arquivo por artefato.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# O que o lcov NÃO alcança, e por quê. Sem esta lista o Sonar conta esses
# arquivos como 0% e a métrica passa a medir a fronteira da suíte unitária em
# vez da qualidade do código.
#
# - `**/*.tsx`: componente React. A verificação deles é a suíte de 90 stories
#   (Vitest browser mode, no `packages/ui`) mais os 33 cenários Playwright —
#   nenhuma das duas emite lcov. É a mesma decisão registrada em "O que não é
#   testado, e por quê" no README: mutação/cobertura em componente React é
#   mutante equivalente demais.
# - `packages/ui/**`: o pacote inteiro é UI; o que sobra de `.ts` ali é
#   `lib/utils.ts`, fixture de teste e o script de captura visual.
# - hooks, stores e `search-params.ts` de apps/web: exercitados pelo E2E. Eles
#   APARECEM no lcov, por importação transitiva, com 2/23 e 3/7 linhas — número
#   que mede o alcance do import, não o da suíte.
# - `dev-axe.ts`: import dinâmico dentro de `import.meta.env.DEV`, some do
#   bundle de produção.
sonar.coverage.exclusions=\
  **/*.tsx,\
  **/*.config.ts,\
  **/*.config.mjs,\
  vite.config.ts,\
  packages/ui/**,\
  apps/web/src/hooks/**,\
  apps/web/src/stores/**,\
  apps/web/src/search-params.ts,\
  apps/web/src/lib/dev-axe.ts
